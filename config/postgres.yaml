database:
  engine: postgres
  host: 127.0.0.1
  port: 5432
  name: app_db
  user: postgres
  password: ${DB_PASSWORD}
  extra_args: []

backup:
  output_root: ./backups
  local_keep: 2

storage:
  provider: s3
  keep_remote: 3
  bucket: my-linode-bucket
  prefix: db-backups
  endpoint_url: https://us-southeast-1.linodeobjects.com
  region: us-southeast-1
  access_key_id: ${LINODE_ACCESS_KEY}
  secret_access_key: ${LINODE_SECRET_KEY}

notifications:
  enabled: true
  discord_webhook_url: ${DISCORD_WEBHOOK_URL}
  telegram_bot_token: ${TELEGRAM_BOT_TOKEN}
  telegram_chat_id: ${TELEGRAM_CHAT_ID}
